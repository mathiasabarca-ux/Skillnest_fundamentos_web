<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="Mathias Abarca" content="width=device-width, initial-scale=1.0">
  <title>Social Like</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h1>Social Like</h1>
  </header>

  <main class="contenedor-principal">
    <aside class="perfil-carta">
      <img src="https://cdn-images.dzcdn.net/images/cover/b103e42fa18e3bdd1a51f911027ac7ea/0x1900-000000-80-0-0.jpg" alt="Misato" class="profile-img">
      <h2>Misato</h2>
      <button class="boton-perfil">Mi perfil</button>
    </aside>

    <section class="feed">
      <h2 class="feed-title">Últimas publicaciones</h2>

      <article class="post">
        <div class="post-header">
          <h3>Rei</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          Acabo de configurar este nuevo <a href="#" class="link">bot de Discord</a>, cuéntame que opinan ustedes.
        </p>
      </article>

      <article class="post">
        <div class="post-header">
          <h3>Asuka</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          Acabo de leer este <a href="#" class="link">nuevo comic</a>. Denle un vistazo.
        </p>
      </article>

      <article class="post">
        <div class="post-header">
          <h3>Shinji</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          No puedo dejar de escuchar este <a href="#" class="link">album</a>. ¿A quién más le gusta?
        </p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
