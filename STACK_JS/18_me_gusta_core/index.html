<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="Mathias Abarca" content="width=device-width, initial-scale=1.0">
  <title>Social Like</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <header class="navbar">
    <h1>Social Like</h1>
  </header>

  <main class="contenedor-principal">
    <aside class="perfil-card">
      <img src="https://media.licdn.com/dms/image/v2/D4D03AQHeQQt-dtjLSw/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1680684892588?e=2147483647&v=beta&t=kE-iflyOYevVScdLMPxQbfxLLyRRGPSxU_Bwc-3SteU" alt="jon pork" class="perfil-img">
      <h2>Raider</h2>
      <button class="btn-de-perfil">Mi perfil</button>
    </aside>

    <section class="feed">
      <h2 class="feed-title">Últimas publicaciones</h2>

      <article class="post">
        <div class="post-header">
          <h3>ariel</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          Acabo de configurar este nuevo <a href="#" class="link">bot de Discord</a>, cuéntame que opinan ustedes.
        </p>
      </article>

      <article class="post">
        <div class="post-header">
          <h3>Gian Carlos</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          Acabo de leer este <a href="#" class="link">nuevo comic</a>. Denle un vistazo.
        </p>
      </article>

      <article class="post">
        <div class="post-header">
          <h3>Mathias</h3>
          <div class="like-box">
            <span class="like-count">0</span> like(s)
            <button class="btn-like">Like</button>
          </div>
        </div>
        <p class="post-text">
          No puedo dejar de escuchar este <a href="#" class="link">album</a>. ¿A quién más le gusta?
        </p>
      </article>
    </section>
  </main>

  <script src="static/js/script.js"></script>
</body>
</html>
