<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinos Destacados</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Destinos destacados</h1>
      <p>Explora lugares increíbles para tu próximo viaje.</p>
    </header>

    <section class="grid-destinos">
      <!-- Card 1: Torres del Paine -->
      <article class="card">
        <div class="card-image"></div>
        <div class="card-content">
          <h2>Torres del Paine</h2>
          <span class="country">Chile</span>
          <p>Naturaleza y paisajes únicos en la Patagonia.</p>
          <button class="btn-more">Ver más</button>
        </div>
      </article>

      <!-- Card 2: Cusco -->
      <article class="card">
        <div class="card-image"></div>
        <div class="card-content">
          <h2>Cusco</h2>
          <span class="country">Perú</span>
          <p>Cultura, historia y tradiciones.</p>
          <button class="btn-more">Ver más</button>
        </div>
      </article>

      <!-- Card 3: Cancún -->
      <article class="card">
        <div class="card-image"></div>
        <div class="card-content">
          <h2>Cancún</h2>
          <span class="country">México</span>
          <p>Playas y descanso frente al mar.</p>
          <button class="btn-more">Ver más</button>
        </div>
      </article>

      
      <article class="card">
        <div class="card-image"></div>
        <div class="card-content">
          <h2>Madrid</h2>
          <span class="country">España</span>
          <p>Gastronomía, museos y vida urbana.</p>
          <button class="btn-more">Ver más</button>
        </div>
      </article>
    </section>
  </main>

</body>
</html>
